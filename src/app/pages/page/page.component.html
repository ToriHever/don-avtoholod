@if (content(); as page) {
  <section class="section">
    <div class="container page-content">
      <a routerLink="/" class="page-content__back">← На главную</a>
      <h1>{{ page.title }}</h1>
      @for (paragraph of paragraphs; track paragraph) {
        <p>{{ paragraph }}</p>
      }
    </div>
  </section>
} @else if (notFound()) {
  <section class="section">
    <div class="container page-content">
      <a routerLink="/" class="page-content__back">← На главную</a>
      <h1>Страница не найдена</h1>
      <p>Похоже, такой страницы больше не существует.</p>
    </div>
  </section>
}
