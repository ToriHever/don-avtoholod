@if (modal.isOpen()) {
  <div class="modal-backdrop" (click)="onBackdropClick($event)">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="question-modal-title">
      <button type="button" class="modal__close" (click)="close()" aria-label="Закрыть">✕</button>

      @if (!sent()) {
        <h3 id="question-modal-title">Задать вопрос</h3>
        <p class="modal__lead">
          Ответим в ближайшее рабочее время по телефону или почте.
        </p>

        <form (ngSubmit)="submit()">
          <label class="modal__field">
            <span>Имя</span>
            <input type="text" name="name" [(ngModel)]="name" placeholder="Как к вам обращаться" />
          </label>

          <label class="modal__field">
            <span>Телефон *</span>
            <input type="tel" name="phone" [(ngModel)]="phone" required placeholder="+7 (___) ___-__-__" />
          </label>

          <label class="modal__field">
            <span>Вопрос *</span>
            <textarea name="question" [(ngModel)]="question" required rows="4" placeholder="Опишите, что случилось с кондиционером"></textarea>
          </label>

          <button type="submit" class="btn btn--primary modal__submit">Отправить вопрос</button>
        </form>
      } @else {
        <h3 id="question-modal-title">Спасибо!</h3>
        <p class="modal__lead">
          Мы открыли для вас письмо с вопросом — отправьте его, и мы ответим
          как можно скорее. Если почта не открылась, позвоните нам напрямую:
          <a href="tel:+79287753852">+7-928-775-38-52</a>.
        </p>
        <button type="button" class="btn btn--secondary modal__submit" (click)="reset()">
          Задать ещё один вопрос
        </button>
      }
    </div>
  </div>
}
